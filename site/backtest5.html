<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>策略5回测</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}header{background:#102a43;color:white;padding:16px}main{padding:10px;max-width:1000px;margin:auto}.box{background:white;border-radius:12px;padding:12px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:right}th{background:#f5f8fc}.scroll{overflow:auto}.pos{color:#067647}.neg{color:#b42318}</style><header><h2>策略5：MA60多头趋势放量（核心条件代理）</h2><p>大单、主力净流入、真实盘中量比未纳入历史通过条件</p></header><main><p><a href="backtest.html">← 返回四策略回测</a></p><div id="a" class="box">加载中…</div></main><script>let n=x=>Number(x??0).toFixed(2),c=x=>x>0?'pos':x<0?'neg':'';fetch('data/backtest-strategy5.json?'+Date.now()).then(x=>x.json()).then(d=>{let s=d.summary;document.querySelector('#a').innerHTML=`<p>${d.note}</p><p>样本 ${s.trades} 笔｜开盘为正 ${s.open_positive_rate}%｜最高≥+1% ${s.high_ge_1pct_rate}%｜平均最高 ${s.avg_high_return}%</p><div class="scroll"><table><tr><th>筛选日</th><th>代码</th><th>名称</th><th>买入</th><th>09:25</th><th>最高窗口</th><th>15:00</th></tr>${d.trades.map(x=>`<tr><td>${x.selection_date}</td><td>${x.code}</td><td>${x.name}</td><td>${x.buy_time}</td><td class="${c(x.open_return)}">${n(x.open_return)}%</td><td class="${c(x.high_return)}">${n(x.high_return)}%</td><td class="${c(x.close_return)}">${n(x.close_return)}%</td></tr>`).join('')}</table></div>`}).catch(()=>a.textContent='数据未同步');</script>
