<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A股尾盘选股</title>
  <style>
  :root{--navy:#102a43;--blue:#1f5fa8;--bg:#f4f6f8;--line:#e1e7ee;--text:#172033;--muted:#5d7085;--green:#078258;--red:#c92a2a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--navy);color:#fff;padding:17px 15px}header h1{margin:0;font-size:1.4rem}header p{margin:.35rem 0 0;color:#cfe3f5;font-size:.9rem}main{max-width:800px;margin:auto;padding:10px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.box{padding:12px;margin-bottom:10px}.meta,.note{font-size:.82rem;color:var(--muted);line-height:1.5}.notice{border-left:4px solid var(--blue)}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}.tab{border:1px solid #b9c8d8;background:#fff;color:#254b75;border-radius:9px;padding:9px 11px;white-space:nowrap;font-weight:650;font-size:.85rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.strategy-title{margin:2px 0;font-size:1.12rem}.purpose{font-size:.9rem;line-height:1.45;margin:.45rem 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.stat{background:#f5f8fc;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:1.1rem}.stat span{font-size:.72rem;color:var(--muted)}details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#24548b;font-size:.86rem;font-weight:650}.formula{font-size:.82rem;line-height:1.55;color:var(--muted)}.list{display:grid;gap:8px}.card{padding:11px;border-left:4px solid #c58b00}.card.candidate{border-left-color:var(--green)}.card.avoid{border-left-color:var(--red)}.card h3{font-size:1rem;margin:0 0 5px}.card a{color:#123d72;text-decoration:none}.pill{display:inline-block;margin:1px 3px 3px 0;padding:2px 6px;border-radius:12px;background:#e7f0ff;color:#174ea6;font-size:.73rem}.pill.good{background:#ddf7e7;color:#05603a}.pill.warn{background:#fff2cc;color:#805b00}.pill.bad{background:#fee4e2;color:#b42318}.line{font-size:.82rem;line-height:1.5;margin:4px 0}.risk{color:#b42318}.empty{padding:18px;text-align:center;color:var(--muted)}.all-list{margin-top:10px}.footer{font-size:.78rem;color:var(--muted);padding:4px 0 14px}.final{border:2px solid #078258;background:#f4fffa}.final h2{margin:0;font-size:1.15rem}.final-card{border-left-color:#078258}.final-card h3{font-size:1.12rem}.final-card .line{margin:5px 0}.perf{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.perf div{background:#f5f8fc;border-radius:8px;padding:8px;text-align:center}.perf b{display:block;font-size:1rem}@media(max-width:480px){header{padding:15px}.stats{gap:4px}.stat{padding:7px 3px}.stat b{font-size:1rem}.stat span{font-size:.65rem}.tab{padding:8px 9px}.perf{gap:4px}.perf div{padding:7px 3px;font-size:.75rem}}
  </style>
</head>
<body>
<header><h1>A股尾盘选股</h1><p>三套策略独立运行 · 次日溢价研究辅助 · 不构成交易建议</p></header>
<main><div class="meta"><a href="diagnostics.html">数据诊断</a> · <a href="progress.html">历史缓存进度</a></div><div id="app" class="box">正在加载数据…</div></main>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),num=(x,n=2)=>Number(x??0).toFixed(n);
const S={strong_close_momentum:{short:'策略1 强势收盘',title:'策略1：强势收盘隔夜动量',purpose:'宽筛：寻找当日主动走强的股票，研究次日早盘惯性。不是直接买入名单。',formula:'MA5向上；收盘>MA5；涨幅3%–8%；量比1–4；换手3%–22%；收盘/最高≥0.97；近10日涨幅-15%–40%。'},recent_limit_up_trend:{short:'策略2 涨停趋势',title:'策略2：近期涨停后的温和趋势',purpose:'宽筛：寻找涨停后未走坏、温和续强的趋势股，研究次日资金承接。',formula:'MA5>MA10且向上；收盘>MA5；2–7交易日前至少一次有效涨停；近5日0%–25%；当日1.5%–7%；量比0.8–4；收盘/最高≥0.97。'},limit_up_reacceleration:{short:'策略3 整理转强',title:'策略3：涨停后整理再转强',purpose:'宽筛：寻找涨停后整理、再次转强的股票，研究二次启动的次日溢价。',formula:'MA5>MA10且向上；收盘>MA5；3–10交易日前至少一次有效涨停；当日1%–7%；成交量/前5日均量0.8–3；换手2%–18%；收盘/最高≥0.97。'},board_resonance_tail_start:{short:'策略4 板块启动',title:'策略4：板块共振尾盘启动（研究版）',purpose:'研究：寻找板块当日同步走强、个股未过度加速且尾盘保持强度的启动票；专门验证次日竞价与早盘溢价。',formula:'MA5向上、收盘>MA5、偏离≤5%；涨幅3.5%–6.5%；量比1.3–3；换手5%–18%；成交额≥5亿；收盘/最高≥0.985；近5日-5%–15%、近10日-10%–25%。最终候选另要求行业板块≥+1.5%。'}};
function r(x,id){return(x.strategy_reviews||{})[id]||{category:'观察',score:0,plus:[],minus:[],pending_manual:[],details:{}}}function cl(q){return q.category==='隔夜候选'?'candidate':q.category==='回避'?'avoid':''}function tg(q){return q.category==='隔夜候选'?'good':q.category==='回避'?'bad':'warn'}
function strict(x,id){return r(x,id).strict_overnight||{passed:false,failures:[]}}function board(q){let d=q.details||{};return d.board_name?d.board_name+(d.board_pct_change==null?'':' '+num(d.board_pct_change)+'%'):'板块待人工确认'}
function card(x,id,final=false){let m=x.metrics||{},q=r(x,id),d=q.details||{},g=strict(x,id),gap=!final&&q.category==='隔夜候选'&&!g.passed?`<p class="line risk"><b>未进入严格候选，还差：</b>${esc((g.failures||[]).join('；')||'该历史结果尚未计算严格闸门')}</p>`:'';return `<article class="card ${final?'final-card ':''}${cl(q)}"><h3><a href="stock.html?code=${encodeURIComponent(x.code)}&strategy=${encodeURIComponent(id)}">${esc(x.name)}</a> <span class="meta">${esc(x.code)}</span></h3><span class="pill ${final?'good':tg(q)}">${final?'严格隔夜候选':esc(q.category)}</span><span class="pill">${num(q.score,0)}分</span><span class="pill">${esc(board(q))}</span><p class="line">涨幅 ${num(m.pct_change)}%　成交额 ${num(m.amount/1e8)}亿　换手 ${num(m.turnover)}%　量比/量能 ${num(m.volume_ratio||m.volume_ma5_multiple)}</p><p class="line">MA5偏离 ${num(m.ma5_distance)}%　收盘/最高 ${num((m.close_high_ratio||0)*100)}%</p><p class="line"><b>为什么优先：</b>${esc((q.plus||[]).slice(0,2).join('；')||'满足该策略宽筛条件')}</p>${gap}<p class="line risk"><b>隔夜风险：</b>${esc((q.minus||[]).slice(0,2).join('；')||(g.failures||[]).slice(0,1).join('；')||(q.pending_manual||[]).slice(0,1).join('；')||'次日竞价与板块强弱仍需确认')}</p></article>`}
function finalZone(d){let hasStrict=Object.prototype.hasOwnProperty.call(d,'final_overnight_candidates'),finals=d.final_overnight_candidates||[],byCode=Object.fromEntries((d.records||[]).map(x=>[x.code,x])),perf=d.overnight_performance?.all;let cards=finals.map(f=>{let x=byCode[f.code];return x?card(x,f.strategy_id,true):''}).join('');let empty=hasStrict?'今天没有通过严格隔夜闸门的候选；空仓也是结果。':'严格隔夜候选层会在下一次交易日自动任务首次生成；当前历史宽筛结果未重算。';let perfHtml=perf?`<div class="perf"><div><b>${perf.trades||0}</b>已结算样本</div><div><b>${perf.high_ge_1pct_rate==null?'-':num(perf.high_ge_1pct_rate,1)+'%'}</b>次日最高≥+1%</div><div><b>${perf.open_positive_rate==null?'-':num(perf.open_positive_rate,1)+'%'}</b>次日开盘为正</div></div>`:'';return `<section class="box final"><h2>今日严格隔夜候选（最多2只）</h2><p class="purpose">从三套宽筛中分别独立复核；不要求多策略命中，也不给重合加分。仅通过成交额、均线偏离、收盘强度、板块与结构闸门的股票才会进入此处。</p>${cards||`<p class="empty">${empty}</p>`}${perfHtml}<p class="note">成功率定义：次日最高价相对筛选收盘价达到或超过 +1%，仅代表历史可观察窗口，不代表实际成交收益。</p></section>`}
function section(d,id){let a=(d.records||[]).filter(x=>(x.strategy_ids||[]).includes(id)).sort((x,y)=>r(y,id).priority_score-r(x,id).priority_score),g=a.filter(x=>strict(x,id).passed),p=g.length?g:a.filter(x=>r(x,id).category!=='回避'),top=p.slice(0,3),c=(d.score_counts||{})[id]||{},ss=(d.strict_summary||{})[id]||{};return `<section class="box"><h2 class="strategy-title">${S[id].title}</h2><p class="purpose">${S[id].purpose}</p><div class="stats"><div class="stat"><b>${a.length}</b><span>宽筛命中</span></div><div class="stat"><b>${ss.strict_eligible??g.length}</b><span>严格合格</span></div><div class="stat"><b>${ss.selected||0}</b><span>最终入选</span></div><div class="stat"><b>${c.avoid||0}</b><span>宽筛回避</span></div></div><details><summary>查看本策略完整宽筛条件</summary><p class="formula">${S[id].formula}</p></details><h3 class="strategy-title">策略内优先查看</h3><div class="list">${top.map(x=>card(x,id,strict(x,id).passed)).join('')||'<p class="empty">本策略暂无候选</p>'}</div><details class="all-list"><summary>展开查看本策略全部 ${a.length} 只宽筛观察池</summary><div class="list" style="margin-top:10px">${a.map(x=>card(x,id)).join('')}</div></details></section>`}
function render(d,review){let intraday=!!d.intraday,ids=Object.keys(S),reviewNote=intraday&&review?.market_date===d.market_date?`<br>15:05收盘复盘：${esc(review.run_at||'-')}`:'';$('#app').outerHTML=`<div id="app"><section class="box notice"><b>${intraday?'14:30盘中版本':'收盘复盘版本'}</b><div class="note">数据日期：${esc(d.market_date)}　更新：${esc(d.quote_time||d.run_at||'-')}${reviewNote}<br>三套策略分别独立排序；“并集 ${d.union_count||0}”仅用于去重浏览，不加分、不代表更优。</div></section>${finalZone(d)}<nav class="tabs">${ids.map((id,i)=>`<button class="tab ${i?'':'active'}" data-tab="${id}">${S[id].short}</button>`).join('')}</nav><div id="panel"></div><p class="footer">上方只显示每日最多2只严格隔夜候选；下方三套区域是宽筛观察池，点股票名称可查看个股拆解、板块与风险。</p></div>`;let p=$('#panel');function go(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));p.innerHTML=section(d,id)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab));go(ids[0])}
Promise.all([fetch('data/intraday-latest.json?'+Date.now()).then(x=>x.ok?x.json():null),fetch('data/formal-latest.json?'+Date.now()).then(x=>x.ok?x.json():null)]).then(([i,f])=>{let today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'}).format(new Date()),d=i?.intraday&&i.market_date===today?i:f;if(!d)throw Error();render(d,f)}).catch(()=>$('#app').textContent='数据尚未同步，请稍后刷新。');
</script></body></html>
