<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股尾盘选股</title><style>
body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px 16px;background:#102a43;color:#fff}h1{margin:0;font-size:1.45rem}header p{margin:.4rem 0 0;color:#cfe3f5}main{max-width:1050px;margin:auto;padding:12px}.box,.card{background:#fff;border-radius:10px}.box{padding:13px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eef5fb;padding:10px;border-radius:8px}.stat b{display:block;font-size:1.2rem}.section{margin:22px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{border:1px solid #e3e8ef;padding:13px}.multi{border:2px solid #e69500}.priority{border:2px solid #0b6e99}.title{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.code,.tag,.meta{font-size:.82rem;color:#53677d}.badge,.rank,.sector{background:#fff0cc;color:#815000;border-radius:20px;padding:3px 6px;font-size:.72rem}.rank{background:#d8eef9;color:#075b80}.sector{background:#eee7ff;color:#5b32a8}.score{margin-left:auto;border-radius:18px;padding:4px 9px;background:#dff7e9;color:#05603a}.secondary{background:#e9f2ff;color:#174ea6}.watch{background:#fff5d7;color:#805b00}.eliminated{background:#fee4e2;color:#b42318}dl{display:grid;grid-template-columns:1.25fr 1fr;gap:7px;margin:12px 0;font-size:.88rem}dt{color:#687a8e}dd{margin:0;text-align:right}.notes{font-size:.82rem;line-height:1.55}.plus{color:#067647}.minus{color:#b42318}.pending{color:#915f00}.research p{font-size:.9rem;line-height:1.6;margin:9px 0}.research b{color:#243b53}.empty{padding:16px;color:#53677d;background:#fff;border-radius:10px}@media(max-width:520px){main{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}
</style></head><body><header><h1>A股尾盘选股</h1><p>每日收盘后研究结果 · 不构成交易建议</p></header><main><p><a href="diagnostics.html">查看正式结果诊断</a> · <a href="progress.html">查看历史数据进度</a></p><div id="app" class="empty">正在加载正式筛选结果…</div><script>
const fmt=(x,n=2)=>Number(x??0).toFixed(n),esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const names={strong_close_momentum:'强势收盘隔夜动量',recent_limit_up_trend:'近期涨停温和趋势',limit_up_reacceleration:'涨停后整理再转强'};
function scoreClass(c){return c==='重点候选'?'':c==='次级候选'?'secondary':c==='观察'?'watch':'eliminated'}
function card(x,rank,r={}){const m=x.metrics||{},s=x.score_detail||{},d=s.details||{};return `<article class="card ${x.strategy_ids.length>1?'multi':''} ${rank?'priority':''}"><div class="title">${rank?`<span class="rank">研究优先 ${rank}</span>`:''}<strong>${esc(x.name)}</strong><span class="code">${x.code}</span>${r.sector?`<span class="sector">${esc(r.sector)}</span>`:''}${x.strategy_ids.length>1?'<span class="badge">多策略命中</span>':''}<span class="score ${scoreClass(x.score_category)}">${x.score}分 · ${x.score_category}</span></div><p class="tag">命中：${x.strategy_ids.map(i=>names[i]||i).join(' · ')}</p><dl><dt>今日涨幅</dt><dd>${fmt(m.pct_change)}%</dd><dt>成交额</dt><dd>${fmt(m.amount/1e8)} 亿</dd><dt>换手率</dt><dd>${fmt(m.turnover)}%</dd><dt>量比 / 成交量倍数</dt><dd>${fmt(m.volume_ratio)} / ${fmt(m.volume_ma5_multiple)}</dd><dt>MA5偏离率</dt><dd>${fmt(m.ma5_distance)}%</dd><dt>收盘/最高</dt><dd>${fmt((m.close_high_ratio||0)*100)}%</dd><dt>最近涨停日期</dt><dd>${d.latest_limit_up_date||'未识别'}</dd><dt>涨停后最大回撤</dt><dd>${d.max_drawdown_after_limit_up==null?'—':fmt(d.max_drawdown_after_limit_up)+'%'}</dd></dl><div class="notes plus">加分：${(s.plus||[]).join('；')||'—'}</div><div class="notes minus">扣分：${(s.minus||[]).join('；')||'无'}</div><div class="notes pending">待人工确认：${(s.pending_manual||[]).join('；')}</div></article>`}
function section(title,rows,research={}){return `<section class="section"><h2>${title}（${rows.length}）</h2>${rows.length?`<div class="cards">${rows.map(x=>card(x,null,research[x.code]||{})).join('')}</div>`:'<div class="empty">今日无符合标的</div>'}</section>`}
function researchCard(x){return `<article class="card research"><div class="title"><strong>${esc(x.code)}</strong><span class="sector">${esc(x.sector)}</span></div><p><b>公司做什么：</b>${esc(x.business)}</p><p><b>公开催化：</b>${esc(x.public_catalyst)}</p><p><b>市场叙事假设：</b>${esc(x.market_narrative)}</p><p><b>预期差：</b>${esc(x.expectation_gap)}</p><p><b>后续验证 / 证伪：</b>${esc(x.next_check)}</p><p class="tag"><a href="${esc(x.source)}" target="_blank" rel="noopener">查看公开来源</a></p></article>`}
fetch('data/formal-latest.json?'+Date.now()).then(r=>r.json()).then(d=>Promise.all([Promise.resolve(d),fetch(`data/research-${d.market_date}.json?${Date.now()}`).then(r=>r.ok?r.json():{items:[],disclaimer:''})])).then(([d,research])=>{if(!d.formal||!d.market_date)throw Error();const a=d.records||[],c=d.score_counts||{},sc=d.strategy_counts||{},map=Object.fromEntries((research.items||[]).map(x=>[x.code,x])),top5=a.filter(x=>x.score>=60).slice(0,5),topicCards=top5.map(x=>map[x.code]).filter(Boolean);document.querySelector('#app').innerHTML=`<div class="box meta"><b>正式筛选：${d.market_date}</b><br>build_id：${d.build_id} · ${d.data_version}<br>历史数据：${d.history_success}/${d.history_success+d.history_failed}，覆盖率 ${(d.coverage*100).toFixed(2)}% · 当日快照已拼接：${d.used_snapshot_composite?'是':'否'}</div><div class="stats"><div class="stat">策略1<b>${sc.strong_close_momentum||0}</b></div><div class="stat">策略2<b>${sc.recent_limit_up_trend||0}</b></div><div class="stat">策略3<b>${sc.limit_up_reacceleration||0}</b></div><div class="stat">三套并集<b>${d.union_count||a.length}</b></div><div class="stat">多策略命中<b>${d.multi_strategy_count||0}</b></div><div class="stat">80分以上<b>${c.key_candidates||0}</b></div><div class="stat">70–79分<b>${c.secondary_candidates||0}</b></div><div class="stat">观察<b>${c.watch||0}</b></div><div class="stat">淘汰<b>${c.eliminated||0}</b></div></div><section class="section"><h2>今日最优5只（研究优先池，非交易建议）</h2><p class="meta">从全部候选按综合排序筛出；板块强度、尾盘分时仍须人工确认。</p><div class="cards">${top5.map((x,i)=>card(x,i+1,map[x.code]||{})).join('')}</div></section><section class="section"><h2>题材拆解：事实、叙事与预期差</h2><p class="meta">${esc(research.disclaimer||'')}</p><div class="cards">${topicCards.map(researchCard).join('')}</div></section>`+section('重点候选（80分以上）',a.filter(x=>x.score>=80),map)+section('次级候选（70–79分）',a.filter(x=>x.score>=70&&x.score<80),map)+section('观察（60–69分）',a.filter(x=>x.score>=60&&x.score<70),map)+section('淘汰（60分以下）',a.filter(x=>x.score<60),map);}).catch(()=>document.querySelector('#app').textContent='正式数据尚未同步，请稍后刷新。');
</script></main></body></html>
