<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股尾盘选股</title><style>body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px 16px;background:#102a43;color:white}h1{margin:0;font-size:1.4rem}header p{margin:.4rem 0 0;color:#cfe3f5}main{max-width:900px;margin:auto;padding:12px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:10px;border-radius:10px}select{padding:8px}.section{margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:13px}.multi{border:2px solid #e69500}.title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.code,.tag{font-size:.82rem;color:#53677d}.badge{background:#fff0cc;color:#815000;border-radius:20px;padding:3px 6px;font-size:.72rem}dl{display:grid;grid-template-columns:1.25fr 1fr;gap:7px;margin:12px 0 0;font-size:.88rem}dt{color:#687a8e}dd{margin:0;text-align:right}.empty{background:#fff;border-radius:10px;padding:20px;color:#53677d}.reason{color:#b42318}@media(max-width:480px){main{padding:10px}.cards{grid-template-columns:1fr}}</style></head><body><header><h1>A股尾盘选股</h1><p>每日收盘后研究结果 · 不构成交易建议</p></header><main><div class="bar"><label>历史日期 <select id="date"></select></label><span id="updated"></span></div><div id="app" class="empty">正在加载数据…</div></main><script>const el=q=>document.querySelector(q),fmt=n=>Number(n).toFixed(2);function card(x){let m=x.metrics;return `<article class="card ${x.strategy_ids.length>1?'multi':''}"><div class="title"><strong>${x.name}</strong><span class="code">${x.code}</span>${x.strategy_ids.length>1?'<span class="badge">多策略命中</span>':''}</div><p class="tag">命中：${x.strategy_names.join(' · ')}</p><dl><dt>今日涨幅</dt><dd>${fmt(m.pct_change)}%</dd><dt>距离5日线</dt><dd>${fmt(m.ma5_distance)}%</dd><dt>收盘 / 最高</dt><dd>${fmt(m.close_high_ratio*100)}%</dd><dt>成交额</dt><dd>${fmt(m.amount/1e8)} 亿</dd><dt>最近涨停</dt><dd>${m.limit_up_days_ago==null?'未识别':m.limit_up_days_ago+' 个交易日前'}</dd><dt>结构评分</dt><dd>${m.structure_score} / 10</dd><dt>风险</dt><dd>${m.risk_notes.join('、')}</dd></dl></article>`}function section(title,items){return `<section class="section"><h2>${title}</h2>${items.length?`<div class="cards">${items.map(card).join('')}</div>`:'<div class="empty">今日无符合标的</div>'}</section>`}async function show(date){let d=await fetch('data/'+date+'.json').then(r=>r.json());el('#updated').textContent='更新时间：'+d.generated_at;let groups={'强势收盘隔夜动量':[],'近期涨停后的温和趋势':[],'涨停后整理再转强':[]};d.records.forEach(x=>x.strategy_names.forEach(n=>groups[n]?.push(x)));let reject=d.rejections.slice(0,30).map(x=>`<article class="card"><strong>${x.name} ${x.code}</strong><p class="reason">淘汰：${x.reason}</p></article>`).join('');el('#app').innerHTML=section('今日候选',d.records)+Object.entries(groups).map(([n,x])=>section(n,x)).join('')+section('多策略同时命中',d.records.filter(x=>x.strategy_ids.length>1))+`<section class="section"><h2>淘汰原因（前30只）</h2><div class="cards">${reject||'<div class="empty">暂无记录</div>'}</div></section>`}fetch('data/manifest.json').then(r=>r.json()).then(m=>{el('#date').innerHTML=m.dates.map(x=>`<option>${x}</option>`).join('');el('#date').value=m.latest;el('#date').onchange=e=>show(e.target.value);show(m.latest)}).catch(()=>el('#app').textContent='暂无已发布结果，请等待下一次收盘后更新。');</script></body></html>
