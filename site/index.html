<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A&#32929;&#23614;&#30424;&#36873;&#32929;</title><style>
:root{--navy:#102a43;--blue:#1f5fa8;--bg:#f4f6f8;--line:#e1e7ee;--text:#172033;--muted:#5d7085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--navy);color:#fff;padding:17px 15px}header h1{margin:0;font-size:1.4rem}header p{margin:.35rem 0 0;color:#cfe3f5;font-size:.9rem}main{max-width:800px;margin:auto;padding:10px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.box{padding:12px;margin-bottom:10px}.meta,.note{font-size:.82rem;color:var(--muted);line-height:1.5}.notice{border-left:4px solid var(--blue)}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}.tab{border:1px solid #b9c8d8;background:#fff;color:#254b75;border-radius:9px;padding:9px 11px;white-space:nowrap;font-weight:650;font-size:.85rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.strategy-title{margin:2px 0;font-size:1.12rem}.purpose{font-size:.9rem;line-height:1.45;margin:.45rem 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.stat{background:#f5f8fc;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:1.1rem}.stat span{font-size:.72rem;color:var(--muted)}details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#24548b;font-size:.86rem;font-weight:650}.formula{font-size:.82rem;line-height:1.55;color:var(--muted)}.list{display:grid;gap:8px}.card{padding:11px;border-left:4px solid #c58b00}.card.candidate{border-left-color:#078258}.card.avoid{border-left-color:#c92a2a}.card h3{font-size:1rem;margin:0 0 5px}.card a{color:#123d72;text-decoration:none}.pill{display:inline-block;margin:1px 3px 3px 0;padding:2px 6px;border-radius:12px;background:#e7f0ff;color:#174ea6;font-size:.73rem}.pill.good{background:#ddf7e7;color:#05603a}.pill.warn{background:#fff2cc;color:#805b00}.pill.bad{background:#fee4e2;color:#b42318}.line{font-size:.82rem;line-height:1.5;margin:4px 0}.risk{color:#b42318}.empty{padding:18px;text-align:center;color:var(--muted)}.all-list{margin-top:10px}.footer{font-size:.78rem;color:var(--muted);padding:4px 0 14px}@media(max-width:480px){header{padding:15px}.stats{gap:4px}.stat{padding:7px 3px}.stat b{font-size:1rem}.stat span{font-size:.65rem}.tab{padding:8px 9px}}
</style></head><body><header><h1>A&#32929;&#23614;&#30424;&#36873;&#32929;</h1><p>&#19977;&#22871;&#31574;&#30053;&#29420;&#31435;&#36816;&#34892; &#183; &#27425;&#26085;&#28322;&#20215;&#30740;&#31350;&#36741;&#21161; &#183; &#19981;&#26500;&#25104;&#20132;&#26131;&#24314;&#35758;</p></header><main><div class="meta"><a href="diagnostics.html">&#25968;&#25454;&#35786;&#26029;</a> &#183; <a href="progress.html">&#21382;&#21490;&#32531;&#23384;&#36827;&#24230;</a></div><div id="app" class="box">&#27491;&#22312;&#21152;&#36733;&#25968;&#25454;&#8230;</div></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),num=(x,n=2)=>Number(x??0).toFixed(n);
const t={s1:'\u7b56\u75651 \u5f3a\u52bf\u6536\u76d8',s2:'\u7b56\u75652 \u6da8\u505c\u8d8b\u52bf',s3:'\u7b56\u75653 \u6574\u7406\u8f6c\u5f3a',title1:'\u7b56\u75651\uff1a\u5f3a\u52bf\u6536\u76d8\u9694\u591c\u52a8\u91cf',title2:'\u7b56\u75652\uff1a\u8fd1\u671f\u6da8\u505c\u540e\u7684\u6e29\u548c\u8d8b\u52bf',title3:'\u7b56\u75653\uff1a\u6da8\u505c\u540e\u6574\u7406\u518d\u8f6c\u5f3a'};
const S={strong_close_momentum:{short:t.s1,title:t.title1,purpose:'\u6293\u5f53\u65e5\u4e3b\u52a8\u8d70\u5f3a\u3001\u6536\u76d8\u9760\u8fd1\u9ad8\u4f4d\u7684\u80a1\u7968\uff0c\u7814\u7a76\u6b21\u65e5\u65e9\u76d8\u60ef\u6027\u6ea2\u4ef7\u300291\u53ea\u4ec5\u4ee3\u8868\u5bbd\u7b5b\u6280\u672f\u547d\u4e2d\uff0c\u4e0d\u662f91\u53ea\u90fd\u53ef\u4ee5\u4e70\u3002',formula:'MA5\u5411\u4e0a\uff1b\u6536\u76d8>MA5\uff1b\u6da8\u5e453%\u20138%\uff1b\u91cf\u6bd41\u20134\uff1b\u6362\u624b3%\u201322%\uff1b\u6536\u76d8/\u6700\u9ad8\u22650.97\uff1b\u8fd110\u65e5\u6da8\u5e45-15%\u201340%\u3002'},recent_limit_up_trend:{short:t.s2,title:t.title2,purpose:'\u6293\u6da8\u505c\u540e\u6ca1\u6709\u8d70\u574f\u3001\u6e29\u548c\u7eed\u5f3a\u7684\u8d8b\u52bf\u80a1\uff0c\u7814\u7a76\u6b21\u65e5\u8d8b\u52bf\u8d44\u91d1\u627f\u63a5\u3002',formula:'MA5>MA10\u4e14\u5411\u4e0a\uff1b\u6536\u76d8>MA5\uff1b2\u20137\u4ea4\u6613\u65e5\u524d\u81f3\u5c11\u4e00\u6b21\u6709\u6548\u6da8\u505c\uff1b\u8fd15\u65e50%\u201325%\uff1b\u5f53\u65e51.5%\u20137%\uff1b\u91cf\u6bd40.8\u20134\uff1b\u6536\u76d8/\u6700\u9ad8\u22650.97\u3002'},limit_up_reacceleration:{short:t.s3,title:t.title3,purpose:'\u6293\u6da8\u505c\u540e\u6574\u7406\u3001\u91cd\u65b0\u8f6c\u5f3a\u4e14\u6210\u4ea4\u4e0d\u8fc7\u70ed\u7684\u80a1\u7968\uff0c\u7814\u7a76\u4e8c\u6b21\u542f\u52a8\u7684\u6b21\u65e5\u6ea2\u4ef7\u3002',formula:'MA5>MA10\u4e14\u5411\u4e0a\uff1b\u6536\u76d8>MA5\uff1b3\u201310\u4ea4\u6613\u65e5\u524d\u81f3\u5c11\u4e00\u6b21\u6709\u6548\u6da8\u505c\uff1b\u5f53\u65e51%\u20137%\uff1b\u6210\u4ea4\u91cf/\u524d5\u65e5\u5747\u91cf0.8\u20133\uff1b\u6362\u624b2%\u201318%\uff1b\u6536\u76d8/\u6700\u9ad8\u22650.97\u3002'}};
function r(x,id){return(x.strategy_reviews||{})[id]||{category:'\u89c2\u5bdf',score:0,plus:[],minus:[],pending_manual:[],details:{}}}function cl(q){return q.category==='\u9694\u591c\u5019\u9009'?'candidate':q.category==='\u56de\u907f'?'avoid':''}function tg(q){return q.category==='\u9694\u591c\u5019\u9009'?'good':q.category==='\u56de\u907f'?'bad':'warn'}
function card(x,id){let m=x.metrics||{},q=r(x,id),d=q.details||{},b=d.board_name?d.board_name+(d.board_pct_change==null?'':' '+num(d.board_pct_change)+'%'):'\u677f\u5757\u5f85\u786e\u8ba4';return `<article class="card ${cl(q)}"><h3><a href="stock.html?code=${encodeURIComponent(x.code)}&strategy=${encodeURIComponent(id)}">${esc(x.name)}</a> <span class="meta">${esc(x.code)}</span></h3><span class="pill ${tg(q)}">${esc(q.category)}</span><span class="pill">${num(q.score,0)}\u5206</span><span class="pill">${esc(b)}</span><p class="line">\u6da8\u5e45 ${num(m.pct_change)}%　\u6210\u4ea4\u989d ${num(m.amount/1e8)}\u4ebf　\u6362\u624b ${num(m.turnover)}%　\u91cf\u6bd4/\u91cf\u80fd ${num(m.volume_ratio||m.volume_multiple)}</p><p class="line">MA5\u504f\u79bb ${num(m.ma5_distance)}%　\u6536\u76d8/\u6700\u9ad8 ${num((m.close_high_ratio||0)*100)}%</p><p class="line"><b>\u5165\u9009\u539f\u56e0\uff1a</b>${esc((q.plus||[]).slice(0,2).join('\uff1b')||'\u6ee1\u8db3\u672c\u7b56\u7565\u786c\u6761\u4ef6')}</p><p class="line risk"><b>\u4e3b\u8981\u98ce\u9669\uff1a</b>${esc((q.minus||[]).slice(0,2).join('\uff1b')||(q.pending_manual||[]).slice(0,1).join('\uff1b')||'\u5f85\u4eba\u5de5\u786e\u8ba4')}</p></article>`}
function section(d,id){let a=(d.records||[]).filter(x=>(x.strategy_ids||[]).includes(id)).sort((x,y)=>r(y,id).priority_score-r(x,id).priority_score),p=a.filter(x=>r(x,id).category!=='\u56de\u907f'),top=(p.length?p:a).slice(0,5),c=(d.score_counts||{})[id]||{};return `<section class="box"><h2 class="strategy-title">${S[id].title}</h2><p class="purpose">${S[id].purpose}</p><div class="stats"><div class="stat"><b>${a.length}</b><span>\u5bbd\u7b5b\u547d\u4e2d</span></div><div class="stat"><b>${c.overnight_candidate||0}</b><span>\u9694\u591c\u5019\u9009</span></div><div class="stat"><b>${c.observe||0}</b><span>\u89c2\u5bdf</span></div><div class="stat"><b>${c.avoid||0}</b><span>\u56de\u907f</span></div></div><details><summary>\u67e5\u770b\u672c\u7b56\u7565\u5b8c\u6574\u6761\u4ef6</summary><p class="formula">${S[id].formula}</p></details><h3 class="strategy-title">\u8be5\u7b56\u7565\u4f18\u5148\u770b 5 \u53ea</h3><div class="list">${top.map(x=>card(x,id)).join('')||'<p class="empty">\u672c\u7b56\u7565\u6682\u65e0\u5019\u9009</p>'}</div><details class="all-list"><summary>\u5c55\u5f00\u67e5\u770b\u8be5\u7b56\u7565\u5168\u90e8 ${a.length} \u53ea</summary><div class="list" style="margin-top:10px">${a.map(x=>card(x,id)).join('')}</div></details></section>`}
function render(d){let ids=Object.keys(S),fresh=d.provisional&&Date.now()-Date.parse(d.quote_time)<180*60000;$('#app').outerHTML=`<div id="app"><section class="box notice"><b>${fresh?'\u76d8\u4e2d\u4e34\u65f6\u7b5b\u9009\uff08\u6536\u76d8\u540e\u590d\u6838\uff09':'\u6536\u76d8\u6b63\u5f0f\u7b5b\u9009'}</b><div class="note">\u6570\u636e\u65e5\u671f\uff1a${esc(d.market_date)}　\u66f4\u65b0\uff1a${esc(d.quote_time||d.run_at||'-')}<br>\u4e09\u5957\u7b56\u7565\u5206\u522b\u6392\u5e8f\uff1b\u201c\u5e76\u96c6 ${d.union_count||0}\u201d\u53ea\u7528\u4e8e\u53bb\u91cd\u6d4f\u89c8\uff0c\u4e0d\u52a0\u5206\u3001\u4e0d\u4ee3\u8868\u66f4\u4f18\u3002</div></section><nav class="tabs">${ids.map((id,i)=>`<button class="tab ${i?'':'active'}" data-tab="${id}">${S[id].short}</button>`).join('')}</nav><div id="panel"></div><p class="footer">\u5148\u5728\u5bf9\u5e94\u7b56\u7565\u5185\u770b 5 \u53ea\uff1b\u70b9\u80a1\u7968\u540d\u79f0\u8fdb\u5165\u8be6\u60c5\u9875\u67e5\u770b\u516c\u53f8\u62c6\u89e3\u3001\u677f\u5757\u786e\u8ba4\u4e0e\u98ce\u9669\u3002</p></div>`;let p=$('#panel');function go(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));p.innerHTML=section(d,id)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.tab));go(ids[0])}
Promise.all([fetch('data/intraday-latest.json?'+Date.now()).then(x=>x.ok?x.json():null),fetch('data/formal-latest.json?'+Date.now()).then(x=>x.ok?x.json():null)]).then(([i,f])=>{let d=i?.provisional&&Date.now()-Date.parse(i.quote_time)<180*60000?i:f;if(!d)throw Error();render(d)}).catch(()=>$('#app').textContent='\u6570\u636e\u5c1a\u672a\u540c\u6b65\uff0c\u8bf7\u7a0d\u540e\u5237\u65b0\u3002');
</script></body></html>
