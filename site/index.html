<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股隔夜策略研究</title>
<style>body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px 16px;background:#102a43;color:#fff}h1,h2,h3{margin:.2em 0}header p{margin:.4rem 0 0;color:#cfe3f5}main{max-width:1050px;margin:auto;padding:12px}.box,.card{background:#fff;border-radius:10px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{border:1px solid #e3e8ef;margin:0}.candidate{border-left:4px solid #087f5b}.observe{border-left:4px solid #c58b00}.avoid{border-left:4px solid #c92a2a}.pill{display:inline-block;padding:3px 7px;margin:2px;border-radius:14px;background:#e7f0ff;color:#174ea6;font-size:.8rem}.good{background:#ddf7e7;color:#05603a}.warn{background:#fff2cc;color:#805b00}.bad{background:#fee4e2;color:#b42318}.meta,.reason{font-size:.88rem;color:#53677d;line-height:1.55}.reason{color:#b42318}dl{display:grid;grid-template-columns:1.25fr 1fr;gap:7px;margin:12px 0;font-size:.88rem}dt{color:#687a8e}dd{margin:0;text-align:right}.count{font-size:1.4rem;font-weight:700}.note{border-left:4px solid #216ba5}.small{font-size:.83rem}@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>A股尾盘隔夜研究</h1><p>三套策略独立运行、独立判断次日溢价条件，不构成交易建议。</p></header><main><p><a href="diagnostics.html">诊断数据</a> · <a href="progress.html">历史缓存进度</a></p><div id="app" class="box">正在加载数据...</div></main>
<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])), num=(x,n=2)=>Number(x??0).toFixed(n);
const STRATEGIES={
 strong_close_momentum:{title:'策略1：强势收盘隔夜动量',purpose:'抓当天已有主动买盘、收在高位附近的强势股，博弈次日早盘惯性溢价。',formula:'MA5向上；收盘站上MA5；涨幅3%–8%；量比1–4；换手3%–22%；收盘/最高≥0.97；近10日涨幅-15%–40%。'},
 recent_limit_up_trend:{title:'策略2：近期涨停后的温和趋势',purpose:'抓涨停后没有走坏、温和续强的趋势股，博弈次日趋势资金承接。',formula:'MA5>MA10且向上；站上MA5；2–7日前有效涨停；近5日涨幅0%–25%；当日涨1.5%–7%；量比0.8–4；收盘/最高≥0.97。'},
 limit_up_reacceleration:{title:'策略3：涨停后整理再转强',purpose:'抓涨停后整理、重新转强且放量不过热的股票，博弈二次启动的次日溢价。',formula:'MA5>MA10且向上；站上MA5；3–10日前有效涨停；当日涨1%–7%；量/前5日均量0.8–3；换手2%–18%；收盘/最高≥0.97。'}
};
function cls(r){return r.category==='隔夜候选'?'candidate':r.category==='观察'?'observe':'avoid'}
function tag(r){return r.category==='隔夜候选'?'good':r.category==='观察'?'warn':'bad'}
function card(x,id){const m=x.metrics||{},r=(x.strategy_reviews||{})[id]||{},d=r.details||{};return `<article class="card ${cls(r)}"><h3><a href="stock.html?code=${encodeURIComponent(x.code)}&strategy=${encodeURIComponent(id)}">${esc(x.name)}</a> <span class="meta">${x.code}</span></h3><span class="pill ${tag(r)}">${esc(r.category)}</span><span class="pill">策略内评分 ${num(r.score,0)}/100</span><p class="meta">行业板块：${esc(d.board_name||'未取得')} ${d.board_pct_change==null?'':num(d.board_pct_change)+'%'}</p><dl><dt>当日/盘中涨幅</dt><dd>${num(m.pct_change)}%</dd><dt>成交额</dt><dd>${num(m.amount/1e8)}亿元</dd><dt>换手率 / 量比</dt><dd>${num(m.turnover)}% / ${num(m.volume_ratio)}</dd><dt>MA5偏离 / 收盘最高比</dt><dd>${num(m.ma5_distance)}% / ${num((m.close_high_ratio||0)*100)}%</dd></dl><p class="meta"><b>为什么进入本策略：</b>${esc((r.plus||[]).slice(0,3).join('；')||'满足本策略硬条件')}</p><p class="reason"><b>缺点/风险：</b>${esc((r.minus||[]).slice(0,3).join('；')||'无额外规则化扣分')}</p><p class="small"><a href="stock.html?code=${encodeURIComponent(x.code)}&strategy=${encodeURIComponent(id)}">查看公司拆解、板块确认与完整风险</a></p></article>`}
function strategySection(d,id){const all=(d.records||[]).filter(x=>(x.strategy_ids||[]).includes(id));const ranked=[...all].sort((a,b)=>((b.strategy_reviews||{})[id]?.priority_score||0)-((a.strategy_reviews||{})[id]?.priority_score||0));const counts=(d.score_counts||{})[id]||{};return `<section class="box"><h2>${STRATEGIES[id].title}</h2><p>${STRATEGIES[id].purpose}</p><p class="meta"><b>宽筛条件：</b>${STRATEGIES[id].formula}</p><div class="grid"><div><span class="count">${all.length}</span><div class="meta">宽筛命中数（不是买入名单）</div></div><div><span class="count">${counts.overnight_candidate||0}</span><div class="meta">板块确认后：隔夜候选</div></div><div><span class="count">${counts.observe||0}</span><div class="meta">观察</div></div><div><span class="count">${counts.avoid||0}</span><div class="meta">回避</div></div></div><h3>策略${id.slice(-1)}独立排序</h3><div class="grid">${ranked.map(x=>card(x,id)).join('')||'<p class="meta">本策略暂无候选。</p>'}</div></section>`}
Promise.all([fetch('data/intraday-latest.json?'+Date.now()).then(r=>r.ok?r.json():null),fetch('data/formal-latest.json?'+Date.now()).then(r=>r.ok?r.json():null)]).then(([intra,formal])=>{const fresh=intra?.provisional&&Date.now()-Date.parse(intra.quote_time)<180*60000?intra:formal;if(!fresh)throw Error();const mode=fresh.provisional?'盘中临时筛选（收盘后会复核）':'收盘正式筛选';$('#app').outerHTML=`<div id="app"><div class="box note"><b>${mode}</b><br><span class="meta">数据日期：${fresh.market_date}；更新：${fresh.quote_time||fresh.run_at}；板块强度来源：${fresh.board_strength_source||'未取得'}。</span><p class="meta">“三套并集”仅是同一只股票重复出现时的去重浏览数：${fresh.union_count||0}。它不加分、不排名、不代表更好；请只在各自策略区内比较。</p></div>${Object.keys(STRATEGIES).map(id=>strategySection(fresh,id)).join('')}</div>`}).catch(()=>$('#app').textContent='数据尚未同步，请稍后刷新。');
</script></body></html>
