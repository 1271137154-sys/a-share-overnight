<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式筛选诊断</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#172033}header{background:#102a43;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:12px}.box{background:#fff;border-radius:10px;padding:14px;margin:12px 0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid #e6eaf0;text-align:left}.pass{color:#067647}.fail{color:#b42318}.missing{color:#915f00}@media(max-width:520px){table{font-size:.76rem}}</style></head><body><header><h1>正式筛选诊断</h1><p>与首页读取同一份正式结果数据。</p></header><main><p><a href="./">返回首页</a></p><div id="meta" class="box">加载中…</div><div id="records"></div><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('data/formal-latest.json?'+Date.now()).then(r=>r.json()).then(d=>{document.querySelector('#meta').innerHTML=`筛选日期：${d.market_date}<br>build_id：${d.build_id}<br>data_version：${d.data_version}<br>历史日线最后日期：${d.historical_last_date}<br>实时快照日期：${d.snapshot_date}<br>已使用实时快照拼接：${d.used_snapshot_composite?'是':'否'}<br>最终计算日期：${d.final_calculation_date}<br>历史不足未参与：${(d.excluded_history_insufficient||[]).join('、')||'无'}`;document.querySelector('#records').innerHTML=(d.records||[]).map(x=>`<section class="box"><h3>${esc(x.name)} ${x.code} · ${x.score}分 · ${x.score_category}</h3><p>命中策略：${x.strategy_ids.join('、')}</p><table><tr><th>指标</th><th>实际值</th><th>说明</th></tr><tr><td>MA5偏离</td><td>${Number(x.metrics.ma5_distance||0).toFixed(2)}%</td><td>评分项</td></tr><tr><td>MA10 / MA20趋势</td><td>${x.score_detail.details.ma10_trend} / ${x.score_detail.details.ma20_trend}</td><td>评分项</td></tr><tr><td>涨停后最大回撤</td><td>${x.score_detail.details.max_drawdown_after_limit_up??'—'}</td><td>评分项</td></tr><tr><td>放量长阴 / 连续冲高回落</td><td>${x.score_detail.details.volume_expansion_long_bear?'是':'否'} / ${x.score_detail.details.repeated_rally_pullbacks?'是':'否'}</td><td>评分项</td></tr><tr><td>待人工确认</td><td colspan="2">${x.score_detail.pending_manual.join('；')}</td></tr></table><p class="pass">加分：${x.score_detail.plus.join('；')||'—'}</p><p class="fail">扣分：${x.score_detail.minus.join('；')||'无'}</p></section>`).join('')||'<div class="box">暂无候选</div>';});</script></main></body></html>
