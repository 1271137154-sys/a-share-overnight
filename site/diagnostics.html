<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筛选漏斗诊断</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#172033}header{background:#102a43;color:#fff;padding:18px}main{max-width:960px;margin:auto;padding:12px}.box{background:#fff;border-radius:10px;padding:14px;margin:12px 0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid #e6eaf0;text-align:left}.pass{color:#067647}.fail{color:#b42318}.missing{color:#b54708}input,button{padding:9px;font-size:1rem}@media(max-width:480px){table{font-size:.78rem}}</style></head><body><header><h1>三套宽筛 · 漏斗诊断</h1><p>数据缺失不会按 0 处理；历史 ST 状态限制会明确标记。</p></header><main><p><a href="./">返回首页</a></p><div id="meta" class="box">加载诊断数据…</div><div id="funnels"></div><div class="box"><h2>涨停识别</h2><div id="limits"></div></div><div class="box"><h2>对照股票逐项诊断</h2><input id="code" placeholder="输入6位代码，例如603629"><button onclick="showCode()">查看</button><div id="stock"></div></div></main><script>let report;const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function table(rows){return '<table>'+rows+'</table>'}function render(){document.querySelector('#meta').innerHTML=`筛选日期：${report.trade_date}<br>任务运行：${report.run_at}<br>原始行情最后日期：${report.latest_history_date||'未知'}<br>最近交易日：${(report.recent_trading_days||[]).join('、')}<br>限制：${report.limit_up.limitation}`;let out='';for(const [id,s] of Object.entries(report.strategies)){out+=`<section class="box"><h2>${id}</h2><p>真实条件失败：${s.real_failures}；数据缺失无法判断：${s.data_missing}；最终命中：${s.matches.length}</p>`+table('<tr><th>顺序条件</th><th>逐步剩余</th><th>单独通过</th></tr>'+s.funnel.map(x=>`<tr><td>${x.condition}</td><td>${x.remaining}</td><td>${s.single_condition[x.condition]??'—'}</td></tr>`).join(''))+'</section>'}document.querySelector('#funnels').innerHTML=out;document.querySelector('#limits').innerHTML=`最近10日识别涨停总数：${report.limit_up.total}`+table('<tr><th>日期</th><th>数量</th></tr>'+Object.entries(report.limit_up.per_date).map(([d,n])=>`<tr><td>${d}</td><td>${n}</td></tr>`).join(''))+table('<tr><th>代码</th><th>名称</th><th>日期</th><th>前收</th><th>涨停价</th><th>收盘</th></tr>'+report.limit_up.sample.map(x=>`<tr><td>${x.code}</td><td>${esc(x.name)}</td><td>${x.date}</td><td>${x.preclose}</td><td>${x.limit_price}</td><td>${x.close}</td></tr>`).join(''));showCode('603629')}function showCode(initial){const code=(initial||document.querySelector('#code').value).trim().padStart(6,'0');document.querySelector('#code').value=code;const s=report.stocks[code]||report.comparison[code];if(!s){document.querySelector('#stock').textContent='未在当前原始行情中找到该股票';return}let out=`<h3>${esc(s.name)} ${code}</h3><p>数据缺失：${(s.missing||[]).join('、')||'无'}</p>`;for(const [id,checks] of Object.entries(s.strategies||{})){out+=`<h4>${id}</h4>`+table('<tr><th>字段</th><th>实际值</th><th>阈值</th><th>结果</th><th>来源</th></tr>'+checks.map(c=>`<tr><td>${c.name}</td><td>${esc(c.actual)}</td><td>${esc(c.threshold)}</td><td class="${c.status}">${c.status}</td><td>${c.name.includes('涨停')?'未复权历史价格；历史ST未知':'当日行情/历史日线'}</td></tr>`).join(''))}document.querySelector('#stock').innerHTML=out}fetch('data/diagnostics-latest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{report=x;render()}).catch(()=>document.querySelector('#meta').textContent='诊断数据尚未生成。')</script></body></html>
