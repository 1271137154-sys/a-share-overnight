<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史缓存进度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;margin:0;color:#172033}main{max-width:600px;margin:auto;padding:16px}.box{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.bar{height:14px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#0f766e}</style><main><p><a href="./">返回首页</a></p><h1>历史数据缓存进度</h1><div id="app" class="box">正在读取…</div></main><script>async function load(){try{let x=await fetch('data/progress.json?'+Date.now()).then(r=>r.json()),p=(x.coverage*100).toFixed(2);document.querySelector('#app').innerHTML=`状态：${x.status}<br>成功：${x.success} / ${x.total}<br>覆盖率：${p}%<div class="bar"><i style="width:${p}%"></i></div><br>失败：${x.failed}<br>当前处理：${x.current_code||'已完成'}<br>最近更新：${x.updated_at}<br>速度：${x.rate_per_minute.toFixed(1)} 只/分钟<br>预计剩余：${x.estimated_remaining_minutes==null?'—':x.estimated_remaining_minutes.toFixed(1)+' 分钟'}<br>失败代码：${(x.failed_codes||[]).join('、')||'无'}`}catch{document.querySelector('#app').textContent='尚未生成进度文件。'}}load();setInterval(load,30000)</script>
