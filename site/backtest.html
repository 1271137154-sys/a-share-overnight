<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔夜策略回测明细</title><style>body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#102a43;color:#fff;padding:16px}h1{font-size:1.35rem;margin:0}header p{margin:.4rem 0 0;color:#cfe3f5;font-size:.88rem}main{max-width:1080px;margin:auto;padding:10px}.box{background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:12px;margin-bottom:10px}.note{font-size:.82rem;color:#5d7085;line-height:1.55}.tabs{display:flex;gap:7px;overflow-x:auto;padding:6px 0}.tab{border:1px solid #b9c8d8;background:#fff;color:#254b75;border-radius:8px;padding:8px;white-space:nowrap}.tab.active{background:#1f5fa8;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f5f8fc;border-radius:8px;padding:8px;text-align:center;font-size:.78rem}.stat b{display:block;font-size:1.05rem}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{border-bottom:1px solid #e6ebf0;padding:7px 5px;text-align:right;white-space:nowrap}th{text-align:center;background:#f7f9fc}td:nth-child(-n+6),th:nth-child(-n+6){text-align:left}.pos{color:#067647}.neg{color:#b42318}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.scroll{overflow-x:auto}table{min-width:1040px}}</style></head><body><header><h1>隔夜策略回测明细</h1><p>每个策略每天最多选策略内评分第一只 · 研究用途</p></header><main><p class="note"><a href="index.html">← 返回选股首页</a></p><div id="app" class="box">正在加载回测数据…</div></main><script>const E=x=>String(x??'-'),N=x=>Number(x??0).toFixed(2),L={momentum_continuation:'强势动量延续',limit_up_trend:'涨停后趋势承接',limit_up_reacceleration:'涨停后整理再转强',board_resonance_tail_start:'板块共振尾盘启动（研究版）'},C=x=>x>0?'pos':x<0?'neg':'';function view(d,k){let s=d.summary[k]||{},a=d.trades[k]||[];return `<section class="box"><h2>${L[k]}</h2><div class="stats"><div class="stat"><b>${s.trades||0}</b>交易数</div><div class="stat"><b>${s.open_positive_rate??'-'}%</b>次日开盘为正</div><div class="stat"><b>${s.high_ge_1pct_rate??'-'}%</b>最高≥+1%</div><div class="stat"><b>${s.avg_high_return??'-'}%</b>平均最高收益</div></div><p class="note">买入和三种卖出情景分开计算；“日内最高窗口”没有分钟时间，不能等同于实际可成交卖点。</p><div class="scroll"><table><thead><tr><th>筛选日</th><th>买入时间</th><th>次日</th><th>代码</th><th>名称</th><th>行业</th><th>09:25卖出</th><th>日内最高窗口</th><th>15:00卖出</th></tr></thead><tbody>${a.map(x=>`<tr><td>${E(x.selection_date)}</td><td>${E(x.buy_time)}</td><td>${E(x.measured_date)}</td><td>${E(x.code)}</td><td>${E(x.name)}</td><td>${E(x.industry)}</td><td class="${C(x.open_return)}">${E(x.open_exit_time)}<br>${N(x.open_return)}%</td><td class="${C(x.high_return)}">${E(x.high_exit_time)}<br>${N(x.high_return)}%</td><td class="${C(x.close_return)}">${E(x.close_exit_time)}<br>${N(x.close_return)}%</td></tr>`).join('')||'<tr><td colspan="9">无信号</td></tr>'}</tbody></table></div></section>`}fetch('data/overnight-family-comparison.json?'+Date.now()).then(r=>r.json()).then(d=>{let keys=Object.keys(d.summary);document.querySelector('#app').outerHTML=`<div id="app"><section class="box"><b>区间：${d.date_range.start} 至 ${d.date_range.end}</b><p class="note">${d.execution_assumption}<br>${d.limitation}</p></section><div class="tabs">${keys.map((k,i)=>`<button class="tab ${i?'':'active'}" data-k="${k}">${L[k]}</button>`).join('')}</div><div id="panel"></div></div>`;let go=k=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.k===k));document.querySelector('#panel').innerHTML=view(d,k)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.k));go(keys[0])}).catch(()=>document.querySelector('#app').textContent='回测数据未同步。');</script></body></html>
