const p=new URLSearchParams(location.search),code=(p.get('code')||'').padStart(6,'0'),sid=p.get('strategy')||'',app=document.querySelector('#app');
const e=x=>String(x??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),n=(x,d=2)=>Number(x??0).toFixed(d);
const T={strong_close_momentum:'\u7b56\u75651\uff1a\u5f3a\u52bf\u6536\u76d8\u9694\u591c\u52a8\u91cf',recent_limit_up_trend:'\u7b56\u75652\uff1a\u8fd1\u671f\u6da8\u505c\u540e\u7684\u6e29\u548c\u8d8b\u52bf',limit_up_reacceleration:'\u7b56\u75653\uff1a\u6da8\u505c\u540e\u6574\u7406\u518d\u8f6c\u5f3a'};
const list=(arr,empty,cls='')=>`<ul class="${cls}">${(arr&&arr.length?arr:[empty]).map(x=>`<li>${e(x)}</li>`).join('')}</ul>`;
function boardBox(d){let pct=d.board_pct_change,name=d.board_name,count=d.board_company_count;if(pct===null||pct===undefined)return `<section class="box board-neutral"><h2>\u677f\u5757\u5f3a\u5ea6\u5206\u6790</h2><p class="pending"><b>\u7ed3\u8bba\uff1a\u5f85\u786e\u8ba4</b> \u2014 \u672a\u83b7\u53d6\u5230\u540c\u65e5\u884c\u4e1a\u677f\u5757\u884c\u60c5\uff0c\u4e0d\u628a\u677f\u5757\u9ed8\u8ba4\u4e3a\u5f3a\u3002</p></section>`;let cl=pct>=2?'board-strong':pct>=0?'board-neutral':'board-weak',label=pct>=2?'\u5f3a\u677f\u5757\u5171\u632f':pct>=0?'\u7ea2\u76d8\u4f46\u4e0d\u5f3a':'\u677f\u5757\u8d70\u5f31',impact=pct>=2?'\u5bf9\u6b21\u65e5\u6ea2\u4ef7\u5c5e\u6b63\u5411\u80cc\u4e66\uff0c\u4f46\u4ecd\u9700\u770b\u65e9\u76d8\u662f\u5426\u5ef6\u7eed\u3002':pct>=0?'\u677f\u5757\u672a\u62d6\u7d2f\uff0c\u4f46\u4e0d\u8db3\u4ee5\u5355\u72ec\u786e\u8ba4\u6ea2\u4ef7\u3002':'\u677f\u5757\u8d70\u5f31\uff0c\u4e2a\u80a1\u72ec\u7acb\u8d70\u5f3a\u7684\u6b21\u65e5\u627f\u63a5\u98ce\u9669\u66f4\u9ad8\u3002';return `<section class="box ${cl}"><h2>\u677f\u5757\u5f3a\u5ea6\u5206\u6790</h2><p><b>${e(name||'\u672a\u5206\u7c7b')}</b>　\u5f53\u65e5\u6da8\u8dcc <b>${n(pct)}%</b>　${count==null?'':`\u677f\u5757\u6210\u5206\u80a1 ${n(count,0)} \u53ea`}</p><p><b>\u7ed3\u8bba\uff1a${label}</b>\u3002${impact}</p><p class="meta">\u6570\u636e\u53e3\u5f84\uff1a\u540c\u65e5\u884c\u4e1a\u677f\u5757\u884c\u60c5\uff0c\u4e0d\u4ee5\u4e2a\u80a1\u6da8\u5e45\u53cd\u63a8\u677f\u5757\u5f3a\u5ea6\u3002</p></section>`}
function page(x,profile,meta){let m=x.metrics||{},r=(x.strategy_reviews||{})[sid]||{},d=r.details||{},other=(x.strategy_ids||[]).filter(z=>z!==sid),boardRisk=d.board_pct_change==null?'\u677f\u5757\u5f3a\u5ea6\u672a\u53d6\u5f97':d.board_pct_change<0?`\u677f\u5757\u5f53\u65e5\u8d70\u5f31 ${n(d.board_pct_change)}%`:'\u677f\u5757\u5f3a\u5ea6\u4ecd\u9700\u6b21\u65e5\u7ade\u4ef7\u9a8c\u8bc1';let business=profile?`<p><b>\u6240\u5c5e\u884c\u4e1a\uff1a</b>${e(profile.industry)}</p><p><b>\u4e3b\u8425\u4e1a\u52a1\uff1a</b>${e(profile.business)}</p><p><b>\u7ecf\u8425\u8303\u56f4\u6458\u8981\uff1a</b>${e(profile.scope)}</p>`:`<p class="pending">\u516c\u53f8\u4e3b\u8425\u8d44\u6599\u672a\u53d6\u5f97\uff0c\u4e0d\u751f\u6210\u9898\u6750\u6216\u8de8\u754c\u53d9\u4e8b\uff0c\u907f\u514d\u81c6\u9020\u3002</p>`;let fixedRisks=['\u5c3e\u76d8\u5206\u65f6\u662f\u5426\u4e3a\u7a81\u51fb\u62c9\u5347\uff0c\u9700\u4eba\u5de5\u786e\u8ba4','\u6b21\u65e5\u7ade\u4ef7\u3001\u65e9\u76d8\u627f\u63a5\u4e0e\u677f\u5757\u662f\u5426\u56de\u6d41\u9700\u9a8c\u8bc1',boardRisk];return `<section class="box"><h1>${e(x.name)} <span class="meta">${x.code}</span></h1><span class="pill">${e(T[sid]||sid)}</span><span class="pill">\u672c\u7b56\u7565 ${n(r.score,0)} / 100</span><span class="pill">${e(r.category)}</span><p class="meta">${meta.provisional?'\u76d8\u4e2d\u4e34\u65f6':'\u6536\u76d8\u6b63\u5f0f'} &#183; ${e(meta.market_date)} &#183; ${e(meta.quote_time||meta.run_at)}</p></section><section class="box"><h2>\u516c\u53f8\u505a\u4ec0\u4e48</h2>${business}</section>${boardBox(d)}<section class="box"><h2>\u8be5\u7b56\u7565\u4e0b\u7684\u5224\u65ad</h2><div class="cols"><section><h3 class="good">\u4f18\u70b9 / \u4e3a\u4ec0\u4e48\u5165\u9009</h3>${list(r.plus,'\u6ee1\u8db3\u8be5\u7b56\u7565\u7684\u5bbd\u7b5b\u786c\u6761\u4ef6','good')}</section><section><h3 class="bad">\u7f3a\u70b9 / \u4e3a\u4ec0\u4e48\u4e0d\u4f18\u5148</h3>${list(r.minus,'\u672a\u51fa\u73b0\u989d\u5916\u89c4\u5219\u5316\u6263\u5206\uff0c\u4ecd\u9700\u7ed3\u5408\u677f\u5757\u4e0e\u5206\u65f6','bad')}</section></div><p class="meta">${other.length?`\u5176\u5b83\u7b56\u7565\u4e5f\u547d\u4e2d\uff1a${other.map(z=>T[z]).join('\uff1b')}\u3002\u8fd9\u4e0d\u52a0\u5206\uff0c\u4e5f\u4e0d\u8868\u793a\u66f4\u597d\uff1b\u53ea\u5728\u5f53\u524d\u7b56\u7565\u5185\u8bc4\u4f30\u3002`:'\u8be5\u80a1\u53ea\u6309\u5f53\u524d\u7b56\u7565\u8bc4\u4f30\uff0c\u4e0d\u4e0e\u5176\u4ed6\u7b56\u7565\u4ea4\u53c9\u52a0\u5206\u3002'}</p></section><section class="box"><h2>\u9694\u591c\u98ce\u9669\u4e0e\u6b21\u65e5\u9a8c\u8bc1</h2>${list([...(r.pending_manual||[]),...fixedRisks],'\u6b21\u65e5\u7ade\u4ef7\u4e0e\u677f\u5757\u627f\u63a5\u4ecd\u9700\u9a8c\u8bc1','pending')}<p class="bad">\u8fd9\u662f\u5c3e\u76d8\u4ecb\u5165\u3001\u7814\u7a76\u6b21\u65e5\u6ea2\u4ef7\u7684\u7cfb\u7edf\uff1b\u5982\u7ade\u4ef7\u4e0d\u53ca\u9884\u671f\u6216\u677f\u5757\u8f6c\u5f31\uff0c\u4e0d\u5e94\u628a\u77ed\u7ebf\u4e34\u65f6\u6539\u6210\u957f\u6301\u3002</p></section><section class="box"><h2>\u5173\u952e\u91cf\u5316\u6570\u636e</h2><dl><dt>\u5f53\u65e5\u6da8\u5e45</dt><dd>${n(m.pct_change)}%</dd><dt>\u6210\u4ea4\u989d</dt><dd>${n(m.amount/1e8)}\u4ebf\u5143</dd><dt>\u6362\u624b\u7387 / \u91cf\u6bd4</dt><dd>${n(m.turnover)}% / ${n(m.volume_ratio)}</dd><dt>MA5\u504f\u79bb</dt><dd>${n(m.ma5_distance)}%</dd><dt>\u6536\u76d8/\u6700\u9ad8</dt><dd>${n((m.close_high_ratio||0)*100)}%</dd><dt>\u6700\u8fd1\u6da8\u505c\u65e5\u671f</dt><dd>${e(d.latest_limit_up_date||'-')}</dd><dt>\u6da8\u505c\u540e\u6700\u5927\u56de\u64a4</dt><dd>${d.max_drawdown_after_limit_up==null?'-':n(d.max_drawdown_after_limit_up)+'%'}</dd></dl></section>`}
Promise.all([fetch('data/intraday-latest.json?'+Date.now()).then(x=>x.ok?x.json():null),fetch('data/formal-latest.json?'+Date.now()).then(x=>x.ok?x.json():null),fetch('data/company-profiles.json?'+Date.now()).then(x=>x.ok?x.json():{})]).then(([i,f,profiles])=>{let d=i?.provisional&&Date.now()-Date.parse(i.quote_time)<180*60000?i:f,x=(d?.records||[]).find(z=>String(z.code).padStart(6,'0')===code);if(!x||!sid||!(x.strategy_ids||[]).includes(sid)){app.innerHTML='<h2>\u672a\u627e\u5230\u8be5\u7b56\u7565\u4e0b\u7684\u5019\u9009</h2><p>\u8bf7\u4ece\u5bf9\u5e94\u7b56\u7565\u7684\u80a1\u7968\u94fe\u63a5\u8fdb\u5165\u3002</p>';return}app.outerHTML=page(x,profiles[code],d)}).catch(()=>app.textContent='\u6570\u636e\u5c1a\u672a\u540c\u6b65\uff0c\u8bf7\u7a0d\u540e\u5237\u65b0\u3002');
</script></body></html>
