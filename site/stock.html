<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个股拆解｜A股尾盘选股</title>
  <style>
    body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px;background:#102a43;color:white}h1{margin:0;font-size:1.4rem}header p{margin:.35rem 0 0;color:#cfe3f5}main{max-width:850px;margin:auto;padding:12px}.box{background:white;border-radius:10px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.ok{color:#067647}.bad{color:#b42318}.pending{color:#915f00}.tag{font-size:.84rem;color:#53677d}.pill{display:inline-block;margin:2px;padding:3px 7px;border-radius:16px;background:#e8f1fb;color:#174ea6;font-size:.8rem}dl{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin:0}dt{color:#687a8e}dd{margin:0;text-align:right}.muted{color:#53677d;line-height:1.6}@media(max-width:480px){main{padding:10px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>个股拆解</h1><p>研究辅助 · 不构成交易建议</p></header>
  <main><p><a href="index.html">← 返回候选列表</a></p><div id="app" class="box">正在加载个股资料…</div></main>
  <script>
    const q=new URLSearchParams(location.search),code=(q.get('code')||'').padStart(6,'0'),app=document.querySelector('#app');
    const esc=x=>String(x??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const fmt=(x,n=2)=>Number(x??0).toFixed(n);
    const names={strong_close_momentum:'策略1：强势收盘隔夜动量',recent_limit_up_trend:'策略2：近期涨停后的温和趋势',limit_up_reacceleration:'策略3：涨停后整理再转强'};
    const section=(title,body)=>`<section class="box"><h2>${title}</h2>${body}</section>`;
    function metrics(m,d={}){return `<dl><dt>当日/盘中涨幅</dt><dd>${fmt(m.pct_change)}%</dd><dt>成交额</dt><dd>${fmt(m.amount/1e8)} 亿元</dd><dt>换手率</dt><dd>${fmt(m.turnover)}%</dd><dt>量比 / 前5日成交量倍数</dt><dd>${fmt(m.volume_ratio)} / ${fmt(m.volume_ma5_multiple)}</dd><dt>MA5偏离</dt><dd>${fmt(m.ma5_distance)}%</dd><dt>收盘（盘中现价）/最高</dt><dd>${fmt((m.close_high_ratio||0)*100)}%</dd><dt>最近有效涨停日</dt><dd>${esc(d.latest_limit_up_date)}</dd><dt>涨停后最大回撤</dt><dd>${d.max_drawdown_after_limit_up==null?'—':fmt(d.max_drawdown_after_limit_up)+'%'}</dd></dl>`}
    function profile(r){if(!r)return '<p class="muted">该股票尚未进入当天的研究优先池，因此没有自动生成主营与题材拆解。技术性淘汰/未优先原因仍会显示在下方。</p>';return `<p><b>板块：</b>${esc(r.sector)}</p><p><b>公司做什么：</b>${esc(r.business)}</p><p><b>公开催化：</b>${esc(r.public_catalyst)}</p><p><b>市场叙事／可能的预期差：</b>${esc(r.market_narrative)}<br><span class="muted">这是对短线资金叙事的研究假设，不是公司已经披露的新业务事实。</span></p><p><b>验证或证伪：</b>${esc(r.next_check)}</p>${r.source?`<p><a href="${esc(r.source)}" target="_blank" rel="noopener">查看公开来源</a></p>`:''}`}
    function detail(item,research,meta){const m=item.metrics||{},s=item.score_detail||{},d=s.details||{},fails=item.failures||{};const why=(s.plus||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>仅因满足至少一套宽筛规则进入候选。</li>';const negatives=[...(s.minus||[]),...Object.entries(fails).filter(([,v])=>v.length).map(([k,v])=>`${names[k]||k} 未通过：${v.join('、')}`)];return `<div class="box"><h1>${esc(item.name)} <span class="tag">${item.code}</span></h1><p>${item.strategy_ids.map(x=>`<span class="pill">${names[x]||x}</span>`).join('')} <span class="pill">综合评分 ${item.score}／100</span></p><p class="tag">数据：${meta.provisional?'盘中临时':'收盘正式'} · ${esc(meta.market_date||'')} · ${esc(meta.quote_time||meta.run_at||'')}</p></div>${section('公司与题材拆解',profile(research))}${section('为什么会被选中？',`<ul class="ok">${why}</ul><p class="muted">入选只代表其满足固定宽筛条件与研究排序，不表示应买入。</p>`)}${section('为什么不优先选它／何时应放弃？',negatives.length?`<ul class="bad">${negatives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">该股同时满足当前命中的策略；仍必须结合板块强度与尾盘分时确认。</p>')}${section('主要风险与待确认项',`<ul class="bad">${(s.minus||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>盘中数据会随收盘前成交变化。</li>'}</ul><p class="pending">待人工确认：${esc((s.pending_manual||['板块强度','尾盘分时']).join('；'))}</p>`)}${section('关键量化数据',metrics(m,d))}`}
    Promise.all([fetch('data/formal-latest.json?'+Date.now()).then(r=>r.ok?r.json():null),fetch('data/intraday-latest.json?'+Date.now()).then(r=>r.ok?r.json():null)]).then(async ([formal,intraday])=>{const active=intraday?.provisional?intraday:formal;if(!active)throw Error('尚无数据');const list=active.records||[];const item=list.find(x=>String(x.code).padStart(6,'0')===code)||formal?.records?.find(x=>String(x.code).padStart(6,'0')===code);if(!item){app.innerHTML='<h2>未找到该股票</h2><p>请从首页候选卡片进入，或稍后等待数据更新。</p>';return}let research=null;try{const data=await fetch(`data/research-${formal?.market_date||active.market_date}.json?${Date.now()}`).then(r=>r.ok?r.json():{items:[]});research=(data.items||[]).find(x=>String(x.code).padStart(6,'0')===code)}catch{}app.outerHTML=detail(item,research,active)}).catch(()=>app.innerHTML='<h2>资料暂未同步</h2><p>请稍后刷新后重试。</p>');
  </script>
</body>
</html>
