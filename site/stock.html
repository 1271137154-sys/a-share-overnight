<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个股策略拆解</title><style>body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px;background:#102a43;color:#fff}header p{margin:.4rem 0 0;color:#cfe3f5}main{max-width:850px;margin:auto;padding:12px}.box{background:#fff;border-radius:10px;padding:14px;margin:12px 0}.good{color:#067647}.bad{color:#b42318}.pending{color:#915f00}.meta{color:#53677d;line-height:1.55}.pill{display:inline-block;padding:3px 7px;margin:2px;border-radius:14px;background:#e7f0ff;color:#174ea6;font-size:.8rem}dl{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}dt{color:#687a8e}dd{margin:0;text-align:right}</style></head><body><header><h1>个股策略拆解</h1><p>按当前所选策略判断次日溢价条件；不构成交易建议。</p></header><main><p><a href="index.html">← 返回三套策略列表</a></p><div id="app" class="box">正在加载...</div></main><script>
const p=new URLSearchParams(location.search),code=(p.get('code')||'').padStart(6,'0'),sid=p.get('strategy')||'',app=document.querySelector('#app');const esc=x=>String(x??'-').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),n=(x,d=2)=>Number(x??0).toFixed(d);const titles={strong_close_momentum:'策略1：强势收盘隔夜动量',recent_limit_up_trend:'策略2：近期涨停后的温和趋势',limit_up_reacceleration:'策略3：涨停后整理再转强'};
const section=(t,x)=>`<section class="box"><h2>${t}</h2>${x}</section>`;
function detail(item,profile,meta){const m=item.metrics||{},r=(item.strategy_reviews||{})[sid]||{},d=r.details||{},other=(item.strategy_ids||[]).filter(x=>x!==sid);const profileHtml=profile?`<p><b>所属行业：</b>${esc(profile.industry)}</p><p><b>主营：</b>${esc(profile.business)}</p><p><b>经营范围摘要：</b>${esc(profile.scope)}</p>`:`<p class="pending">公司主营资料正在从巨潮公开资料缓存；未取得前不生成题材或跨界叙事，避免臆造。</p>`;const board=d.board_pct_change==null?'未取得（本策略不能确认板块共振）':`${esc(d.board_name)} 当日 ${n(d.board_pct_change)}%`;
return `<div class="box"><h1>${esc(item.name)} <span class="meta">${item.code}</span></h1><span class="pill">${esc(titles[sid]||sid)}</span><span class="pill">策略内评分 ${n(r.score,0)}/100</span><span class="pill">结论：${esc(r.category)}</span><p class="meta">数据：${meta.provisional?'盘中临时':'收盘正式'} · ${esc(meta.market_date)} · ${esc(meta.quote_time||meta.run_at)}</p></div>${section('公司做什么 / 当前板块',profileHtml+`<p><b>板块强度确认：</b>${board}</p><p class="meta">板块数据使用同日行业板块行情；如果未取得，页面不会把它默认成强板块。</p>`)}${section('为什么本策略会选它？',`<ul class="good">${(r.plus||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>满足该策略的固定宽筛条件。</li>'}</ul><p class="meta">策略目标：仅研究“尾盘介入后，次日是否存在可兑现溢价”，不是判断长期价值。</p>`)}${section('为什么本策略不建议优先做 / 缺点是什么？',`<ul class="bad">${(r.minus||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>未出现额外规则化扣分，但仍需确认分时与板块。</li>'}</ul><p class="meta">${other.length?`它同时满足其他策略（${other.map(x=>titles[x]).join('、')}），但这不会额外加分；每种策略的溢价来源和风险不同。`:'它未被拿去和其他策略比较或扣分。'}</p>`)}${section('隔夜执行风险与次日验证',`<ul class="pending">${(r.pending_manual||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>次日竞价、板块强弱与开盘承接仍需验证。</li>'}</ul><p class="bad">若板块转弱、竞价低于预期或开盘无法收回关键价位，应按隔夜模式处理，不把短线临时改成长持。</p>`)}${section('关键数据',`<dl><dt>涨幅</dt><dd>${n(m.pct_change)}%</dd><dt>成交额</dt><dd>${n(m.amount/1e8)}亿元</dd><dt>换手率 / 量比</dt><dd>${n(m.turnover)}% / ${n(m.volume_ratio)}</dd><dt>MA5偏离</dt><dd>${n(m.ma5_distance)}%</dd><dt>收盘/最高</dt><dd>${n((m.close_high_ratio||0)*100)}%</dd><dt>涨停后最大回撤</dt><dd>${d.max_drawdown_after_limit_up==null?'-':n(d.max_drawdown_after_limit_up)+'%'}</dd></dl>`)}${section('题材与预期差',`<p class="meta">只有在有公开公告、业绩预告、订单或权威资料时，才会标出“公开催化”。不将传闻、概念标签或多策略命中当作题材确认。</p>`)} `}
Promise.all([fetch('data/intraday-latest.json?'+Date.now()).then(r=>r.ok?r.json():null),fetch('data/formal-latest.json?'+Date.now()).then(r=>r.ok?r.json():null),fetch('data/company-profiles.json?'+Date.now()).then(r=>r.ok?r.json():{})]).then(([intra,formal,profiles])=>{const active=intra?.provisional&&Date.now()-Date.parse(intra.quote_time)<180*60000?intra:formal;const item=(active?.records||[]).find(x=>String(x.code).padStart(6,'0')===code);if(!item||!sid||!item.strategy_ids.includes(sid)){app.innerHTML='<h2>未找到该策略下的候选</h2><p>请从策略列表中的股票链接进入。</p>';return}app.outerHTML=detail(item,profiles[code],active)}).catch(()=>app.textContent='数据尚未同步，请稍后刷新。');
</script></body></html>
