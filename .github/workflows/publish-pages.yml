name: Publish free dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ENABLE_SCHEDULER: "false"
      DATABASE_PATH: data/stock_selector.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
